<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint 与平均 Episode 长度</title>
  <desc id="desc">平均 Episode 长度：Pretrained 520，Checkpoint 1k 290，Checkpoint 2k 291.13 control steps。</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; }
    .subtitle { font-size: 15px; fill: #5f6b7a; }
    .axis { font-size: 13px; fill: #5f6b7a; }
    .value { font-size: 16px; font-weight: 600; }
    .label { font-size: 15px; }
  </style>
  <text x="105" y="48" class="title">Checkpoint 与平均 Episode 长度</text>
  <text x="105" y="75" class="subtitle">数值越低表示完成越快；失败 Episode 会达到 520-step horizon</text>
  <line x1="105" y1="440.0" x2="905" y2="440.0" stroke="#d8dee8"/>
  <text x="91" y="445.0" text-anchor="end" class="axis">0</text>
  <line x1="105" y1="356.2" x2="905" y2="356.2" stroke="#d8dee8"/>
  <text x="91" y="361.2" text-anchor="end" class="axis">140</text>
  <line x1="105" y1="272.5" x2="905" y2="272.5" stroke="#d8dee8"/>
  <text x="91" y="277.5" text-anchor="end" class="axis">280</text>
  <line x1="105" y1="188.8" x2="905" y2="188.8" stroke="#d8dee8"/>
  <text x="91" y="193.8" text-anchor="end" class="axis">420</text>
  <line x1="105" y1="105.0" x2="905" y2="105.0" stroke="#d8dee8"/>
  <text x="91" y="110.0" text-anchor="end" class="axis">560</text>
  <rect x="165.0" y="128.9" width="146.7" height="311.1" rx="5" fill="#5f6b7a"/>
  <text x="238.3" y="116.9" text-anchor="middle" class="value">520</text>
  <text x="238.3" y="472.0" text-anchor="middle" class="label">Pretrained</text>
  <text x="238.3" y="497.0" text-anchor="middle" class="axis">n=10</text>
  <rect x="431.7" y="266.5" width="146.7" height="173.5" rx="5" fill="#e07a1f"/>
  <text x="505.0" y="254.5" text-anchor="middle" class="value">290</text>
  <text x="505.0" y="472.0" text-anchor="middle" class="label">Checkpoint 1k</text>
  <text x="505.0" y="497.0" text-anchor="middle" class="axis">n=10</text>
  <rect x="698.3" y="265.8" width="146.7" height="174.2" rx="5" fill="#2563eb"/>
  <text x="771.7" y="253.8" text-anchor="middle" class="value">291.1</text>
  <text x="771.7" y="472.0" text-anchor="middle" class="label">Checkpoint 2k</text>
  <text x="771.7" y="497.0" text-anchor="middle" class="axis">n=30</text>
</svg>
